<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talanta Admin</title><style>body{background:#0b1220;color:#eef3fb;font:14px Arial;padding:25px}main{max-width:1100px;margin:auto}input,button{padding:12px;background:#17263c;color:white;border:1px solid #34445c;border-radius:5px}button{background:#f5bd4d;color:#111;font-weight:bold}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{text-align:left;padding:12px;border-bottom:1px solid #29384e;font-size:12px}.wrap{overflow:auto}</style></head><body><main><h1>Talanta Tickets · Admin</h1><p>Enter your server ADMIN_KEY.</p><input id="key" type="password" placeholder="Admin key"><button onclick="loadRows()">Load bookings</button><p id="msg"></p><div class="wrap"><table><thead><tr><th>Reference</th><th>Customer</th><th>Category</th><th>Qty</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>async function loadRows(){try{let r=await fetch('/api/admin/bookings',{headers:{'x-admin-key':key.value}}),d=await r.json();if(!r.ok)throw Error(d.message);rows.innerHTML=d.map(x=>`<tr><td>${x.code}</td><td>${x.name}<br>${x.phone}</td><td>${x.category}</td><td>${x.quantity}</td><td>KSh ${x.amount.toLocaleString()}</td><td>${x.status}</td><td>${new Date(x.createdAt).toLocaleString()}</td></tr>`).join('');msg.textContent=d.length+' bookings'}catch(e){msg.textContent=e.message}}</script></body></html>
